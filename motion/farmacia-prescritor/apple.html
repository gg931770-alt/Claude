<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Pop';src:url('poppins-300.woff2');font-weight:300}
@font-face{font-family:'Pop';src:url('poppins-400.woff2');font-weight:400}
@font-face{font-family:'Pop';src:url('poppins-500.woff2');font-weight:500}
@font-face{font-family:'Pop';src:url('poppins-600.woff2');font-weight:600}
@font-face{font-family:'Pop';src:url('poppins-700.woff2');font-weight:700}
@font-face{font-family:'Pop';src:url('poppins-800.woff2');font-weight:800}
html,body{margin:0;background:#F4F4F4;overflow:hidden}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const W=1080,H=1920,CX=540;
const BLACK='#0E0F13',BLUE='#2286E6',CYAN='#21FBFC',WHITE='#F4F4F4',GRAY='#8B909A',INK='#0E0F13';
const T=TIMELINE,SC={};T.scenes.forEach((s,i)=>{s.i=i;s.vstart=i===0?0:s.start;SC[s.id]=s;});
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const E={lin:t=>t,out:t=>1-Math.pow(1-t,3),inC:t=>t*t*t,io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,expo:t=>t===1?1:1-Math.pow(2,-10*t),
 back:t=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
 spring:t=>1-Math.exp(-6*t)*Math.cos(9*t)};
const P=(u,a,d=.5,e=E.out)=>e(cl((u-a)/d));
function rnd(seed){let a=seed|0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function L(sid,w,n=0){const s=SC[sid];const norm=x=>x.toLowerCase().normalize('NFD').replace(/[^\w$]/g,'');let k=0;for(const o of s.words){if(norm(o.w).startsWith(norm(w))){if(k===n)return o.t0-s.vstart;k++;}}console.warn('word?',sid,w);return 0;}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,h/2,w/2));X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function grad(x0,y0,x1,y1,a=BLUE,b=CYAN){const g=X.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function F(size,w=500){X.font=`${w} ${size}px Pop`;}
function mw(s,size,w=500,ls=0){X.save();F(size,w);X.letterSpacing=ls+'px';const r=X.measureText(s).width;X.restore();return r;}
// texto com blur-in: o={size,w,color,align,alpha,blur,scale,dy,ls,glow,grad}
function tx(s,x,y,o={}){const size=o.size||60;X.save();X.globalAlpha*=cl(o.alpha??1);if((o.blur||0)>.3)X.filter=`blur(${o.blur.toFixed(1)}px)`;
 X.translate(x,y+(o.dy||0));const sc=o.scale??1;X.scale(sc,sc);F(size,o.w||500);X.textBaseline='middle';X.textAlign=o.align||'center';if(o.ls)X.letterSpacing=o.ls+'px';
 let fill=o.color||INK;if(o.grad){const w=X.measureText(s).width,ax=o.align==='left'?0:o.align==='right'?-w:-w/2;fill=grad(ax,0,ax+w,0,o.grad[0],o.grad[1]);}
 if(o.glow){X.shadowColor=o.glowColor||'rgba(33,251,252,.55)';X.shadowBlur=o.glow;}
 X.fillStyle=fill;X.fillText(s,0,0);if(o.glow){X.shadowBlur=0;X.fillText(s,0,0);}X.restore();}
// entrada desfocada padrão
function bin(s,x,y,u,a,o={},d=.55){const p=P(u,a,d,E.out);if(p<=0)return;tx(s,x,y,{...o,alpha:p*(o.alpha??1),blur:(1-p)*22,dy:(1-p)*36,scale:lerp(1.08,1,p)*(o.scale??1)});}
// letras com stagger (rise | drop)
function letters(s,x,y,u,a,o={}){const size=o.size||100,w=o.w||600,stag=o.stag??.035,ls=o.ls||0;const tot=mw(s,size,w,ls);let x0=o.align==='left'?x:x-tot/2;
 for(let i=0;i<s.length;i++){const ch=s[i],cw=mw(ch,size,w)+ls,p=P(u,a+i*stag,o.d||.55,o.ease||E.back),q=cl(p);
  if(q>0){const dy=o.mode==='drop'?-(1-p)*260:(1-p)*90;tx(ch,x0+cw/2-ls/2,y,{...o,size,w,ls:0,alpha:cl(q*1.6)*(o.alpha??1),blur:(1-q)*14,dy,scale:lerp(.85,1,q),align:'center'});}x0+=cw;}return tot;}
// card branco (ou escuro)
function card(x,y,w,h,o={}){X.save();X.globalAlpha*=o.alpha??1;rr(x,y,w,h,o.r||40);
 if(o.dark){X.shadowColor='rgba(0,0,0,.5)';X.shadowBlur=60;X.shadowOffsetY=20;X.fillStyle='#15171e';X.fill();X.shadowColor='transparent';X.lineWidth=2;X.strokeStyle='rgba(244,244,244,.09)';X.stroke();
  const g=X.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'rgba(255,255,255,.06)');g.addColorStop(.5,'rgba(255,255,255,0)');X.fillStyle=g;X.fill();}
 else{X.shadowColor='rgba(14,15,19,.10)';X.shadowBlur=70;X.shadowOffsetY=26;X.fillStyle='#FFFFFF';X.fill();X.shadowColor='transparent';X.lineWidth=2;X.strokeStyle='rgba(14,15,19,.06)';X.stroke();}
 X.restore();}
// entra card: escala + blur
function enter(u,a,cx,cy,fn,d=.6){const p=P(u,a,d,E.back),q=cl(P(u,a,d*.7,E.out));if(q<=0)return 0;X.save();X.globalAlpha*=q;if(q<1)X.filter=`blur(${((1-q)*18).toFixed(1)}px)`;
 X.translate(cx,cy+(1-q)*60);const s=lerp(.9,1,p);X.scale(s,s);X.translate(-cx,-cy);fn(q);X.restore();return q;}
function pill(s,x,y,o={}){const size=o.size||40,w=mw(s,size,o.w||500)+size*1.6+(o.icon?size*1.1:0),h=size*2.1;X.save();X.globalAlpha*=o.alpha??1;X.translate(x,y);const sc=o.scale??1;X.scale(sc,sc);
 rr(-w/2,-h/2,w,h,h/2);
 if(o.fill){X.shadowColor='rgba(34,134,230,.35)';X.shadowBlur=40;X.shadowOffsetY=12;X.fillStyle=grad(-w/2,-h/2,w/2,h/2,'#1f7fe0','#28b9f2');X.fill();X.shadowColor='transparent';
  const g=X.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.5,'rgba(255,255,255,0)');X.fillStyle=g;X.fill();}
 else if(o.dark){X.fillStyle=o.light?'rgba(244,244,244,.06)':BLACK;X.fill();X.lineWidth=2;X.strokeStyle='rgba(244,244,244,.18)';X.stroke();}
 else{X.fillStyle=o.bg||'rgba(255,255,255,.9)';X.fill();X.lineWidth=3;X.strokeStyle=o.stroke||'rgba(14,15,19,.85)';X.stroke();}
 F(size,o.w||500);X.textAlign='center';X.textBaseline='middle';X.fillStyle=o.fill||o.dark?'#FFFFFF':INK;const off=o.icon?size*.55:0;X.fillText(s,off,size*.06);
 if(o.icon)o.icon(-w/2+size*1.15,0,size);
 if(o.strike){X.strokeStyle=INK;X.lineWidth=4;X.beginPath();X.moveTo(-w/2+size*.6+off,0);X.lineTo(lerp(-w/2+size*.6+off,w/2-size*.6,o.strike),0);X.stroke();}
 X.restore();return w;}
function check(x,y,s,color='#fff',lw=8,p=1){X.save();X.translate(x,y);X.lineCap='round';X.lineJoin='round';X.strokeStyle=color;X.lineWidth=lw;X.beginPath();const pts=[[-s*.42,0],[-s*.12,s*.3],[s*.45,-s*.32]];
 X.moveTo(...pts[0]);if(p<.4)X.lineTo(lerp(pts[0][0],pts[1][0],p/.4),lerp(pts[0][1],pts[1][1],p/.4));else{X.lineTo(...pts[1]);const k=(p-.4)/.6;X.lineTo(lerp(pts[1][0],pts[2][0],k),lerp(pts[1][1],pts[2][1],k));}X.stroke();X.restore();}
function xmark(x,y,s,color=INK,lw=7,p=1){X.save();X.translate(x,y);X.lineCap='round';X.strokeStyle=color;X.lineWidth=lw;X.beginPath();const a=cl(p*2),b=cl(p*2-1);X.moveTo(-s/2,-s/2);X.lineTo(lerp(-s/2,s/2,a),lerp(-s/2,s/2,a));if(b>0){X.moveTo(s/2,-s/2);X.lineTo(lerp(s/2,-s/2,b),lerp(-s/2,s/2,b));}X.stroke();X.restore();}
function person(x,y,s,color=INK,alpha=1){X.save();X.globalAlpha*=alpha;X.translate(x,y);X.scale(s/100,s/100);X.fillStyle=color;X.beginPath();X.arc(0,-30,24,0,Math.PI*2);X.fill();X.beginPath();X.moveTo(-44,48);X.quadraticCurveTo(-44,2,0,2);X.quadraticCurveTo(44,2,44,48);X.closePath();X.fill();X.restore();}
function brackets(x,y,w,h,p,color=BLUE){const o=lerp(40,0,p);X.save();X.globalAlpha*=cl(p*2);X.strokeStyle=color;X.lineWidth=5;X.lineCap='round';const L2=Math.min(w,h)*.22;
 [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>{const cx=x+sx*(w/2+o),cy=y+sy*(h/2+o);X.beginPath();X.moveTo(cx,cy-sy*L2);X.lineTo(cx,cy);X.lineTo(cx-sx*L2,cy);X.stroke();});X.restore();}
function logoSymbol(x,y,r,alpha=1,dark=true){X.save();X.globalAlpha*=alpha;X.translate(x,y);X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fillStyle=dark?'#14161d':'#0E0F13';X.shadowColor='rgba(33,251,252,.35)';X.shadowBlur=r*.4;X.fill();X.shadowBlur=0;
 X.lineWidth=r*.06;X.strokeStyle=grad(-r,-r,r,r);X.beginPath();X.arc(0,0,r*.96,0,Math.PI*2);X.stroke();const g=grad(-r*.5,r*.5,r*.5,-r*.5);X.fillStyle=g;X.strokeStyle=g;
 X.beginPath();X.arc(-r*.2,-r*.42,r*.11,0,Math.PI*2);X.fill();rr(-r*.31,-r*.2,r*.22,r*.66,r*.05);X.fill();X.lineWidth=r*.12;X.lineCap='round';X.beginPath();X.moveTo(r*.02,r*.28);X.lineTo(r*.42,-r*.12);X.stroke();
 X.beginPath();X.moveTo(r*.48,-r*.18);X.lineTo(r*.18,-r*.18);X.lineTo(r*.48,r*.12);X.closePath();X.fill();X.restore();}
function rxDoc(x,y,w,h){X.save();X.translate(x,y);rr(-w/2,-h/2,w,h,16);X.fillStyle='#fff';X.shadowColor='rgba(0,0,0,.12)';X.shadowBlur=20;X.fill();X.shadowBlur=0;
 F(h*.2,700);X.fillStyle=BLUE;X.textAlign='left';X.textBaseline='top';X.fillText('Rx',-w/2+18,-h/2+12);X.fillStyle='#d9dce2';for(let i=0;i<4;i++){rr(-w/2+18,-h/2+h*.42+i*h*.12,(w-36)*(i%2?.65:.9),h*.05,4);X.fill();}
 X.strokeStyle=INK;X.lineWidth=3;X.beginPath();X.moveTo(w*.05,h*.4);X.bezierCurveTo(w*.15,h*.3,w*.22,h*.46,w*.38,h*.36);X.stroke();X.restore();}
function chatGlyph(x,y,r,color='#fff',dots=BLUE){X.save();X.translate(x,y);X.fillStyle=color;X.beginPath();X.ellipse(0,-r*.05,r*.62,r*.5,0,0,Math.PI*2);X.fill();X.beginPath();X.moveTo(-r*.4,r*.25);X.lineTo(-r*.55,r*.6);X.lineTo(-r*.1,r*.38);X.fill();X.fillStyle=dots;for(let i=-1;i<=1;i++){X.beginPath();X.arc(i*r*.22,-r*.05,r*.07,0,Math.PI*2);X.fill();}X.restore();}
function cursor(x,y,s=1,press=0){X.save();X.translate(x,y);X.scale(s*(1-press*.12),s*(1-press*.12));X.shadowColor='rgba(0,0,0,.25)';X.shadowBlur=12;X.shadowOffsetY=4;X.fillStyle=INK;X.strokeStyle='#fff';X.lineWidth=4;
 X.beginPath();X.moveTo(0,0);X.lineTo(0,62);X.lineTo(15,48);X.lineTo(26,72);X.lineTo(36,67);X.lineTo(25,44);X.lineTo(45,44);X.closePath();X.stroke();X.fill();X.restore();}
function toggle(x,y,on,s=1){X.save();X.translate(x,y);X.scale(s,s);const w=150,h=86;rr(-w/2,-h/2,w,h,h/2);X.fillStyle=on>0?`rgba(34,134,230,${on})`:'#e3e5ea';X.fill();if(on<1){X.globalAlpha=1-on;rr(-w/2,-h/2,w,h,h/2);X.fillStyle='#e3e5ea';X.fill();X.globalAlpha=1;}
 X.shadowColor='rgba(0,0,0,.2)';X.shadowBlur=10;X.shadowOffsetY=3;X.fillStyle='#fff';X.beginPath();X.arc(lerp(-w/2+h/2,w/2-h/2,on),0,h/2-6,0,Math.PI*2);X.fill();X.restore();}
function ripple(x,y,u,a,color='rgba(34,134,230,'){const p=cl((u-a)/.6);if(p<=0||p>=1)return;X.save();X.beginPath();X.arc(x,y,lerp(10,120,E.out(p)),0,Math.PI*2);X.fillStyle=color+(.35*(1-p))+')';X.fill();X.restore();}
function rings(x,y,u,dark,n=5,base=160,gap=150){X.save();for(let i=0;i<n;i++){const r=base+i*gap+((u*30)%gap);X.globalAlpha=(dark?.10:.08)*(1-i/n);X.strokeStyle=dark?'#F4F4F4':INK;X.lineWidth=2;X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.stroke();}X.restore();}
function sweep(x,y,w,h,p,dark){if(p<=0||p>=1)return;X.save();X.beginPath();X.rect(x,y,w,h);X.clip();const sx=lerp(x-200,x+w+200,p);const g=X.createLinearGradient(sx-100,0,sx+100,0);const c=dark?'255,255,255':'255,255,255';
 g.addColorStop(0,`rgba(${c},0)`);g.addColorStop(.5,`rgba(${c},.5)`);g.addColorStop(1,`rgba(${c},0)`);X.globalCompositeOperation=dark?'lighter':'source-atop';X.fillStyle=g;X.translate(sx,y+h/2);X.transform(1,0,-.3,1,0,0);X.fillRect(-100,-h,200,h*2);X.restore();}
function glowDot(x,y,r,u){X.save();const g=X.createRadialGradient(x,y,0,x,y,r*4);g.addColorStop(0,'rgba(33,251,252,.5)');g.addColorStop(1,'rgba(33,251,252,0)');X.fillStyle=g;X.fillRect(x-r*4,y-r*4,r*8,r*8);X.fillStyle='#fff';X.beginPath();X.arc(x,y,r*(1+.1*Math.sin(u*6)),0,Math.PI*2);X.fill();X.restore();}

// ---------- fundos ----------
function bgLight(t){X.fillStyle='#F4F4F4';X.fillRect(0,0,W,H);
 const blob=(x,y,r,rgb,a)=>{const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);X.fillStyle=g;X.fillRect(0,0,W,H);};
 blob(160+Math.sin(t*.3)*120,300+Math.cos(t*.25)*120,620,'34,134,230',.13);blob(940+Math.cos(t*.28)*110,1600+Math.sin(t*.33)*120,700,'33,251,252',.13);blob(900+Math.sin(t*.2)*80,700,420,'34,134,230',.06);}
function bgDark(t){X.fillStyle=BLACK;X.fillRect(0,0,W,H);const g=X.createRadialGradient(CX,900,0,CX,900,900);g.addColorStop(0,'rgba(34,134,230,.20)');g.addColorStop(.5,'rgba(34,134,230,.05)');g.addColorStop(1,'rgba(34,134,230,0)');X.fillStyle=g;X.fillRect(0,0,W,H);
 const g2=X.createRadialGradient(CX+Math.sin(t*.4)*200,1500,0,CX,1500,600);g2.addColorStop(0,'rgba(33,251,252,.07)');g2.addColorStop(1,'rgba(33,251,252,0)');X.fillStyle=g2;X.fillRect(0,0,W,H);}

// ---------- cenas ----------
const S={};
const DARK=new Set(['s2','s5','s8','s9','s12','s13']);

S.s1={draw(u){const s='s1';const tfa=L(s,'farmácia'),tf=L(s,'fatura'),t80=L(s,'80'),tm=L(s,'mês');
 bin('Se você tem uma',CX,560,u,.15,{size:50,color:GRAY,w:400});
 letters('farmácia de manipulação',CX,650,u,tfa-.15,{size:72,w:600,stag:.022});
 enter(u,tf-.35,CX,1030,()=>{card(170,820,740,420);F(34,500);X.fillStyle=GRAY;X.textAlign='left';X.textBaseline='middle';X.fillText('Faturamento mensal',220,890);
  pill('este mês',790,890,{size:24,stroke:'rgba(14,15,19,.2)'});
  const cp=E.io(cl((u-tf)/(t80+.4-tf)));const v=Math.round(cp*80);tx(`R$ ${v}.000`,220,990,{size:104,w:700,align:'left'});
  // sparkline
  X.save();X.beginPath();const n=40,pr=cl((u-tf)/1.2);for(let i=0;i<=n*pr;i++){const k=i/n,x=220+k*640,y=1150-k*70-Math.sin(k*8)*18;i?X.lineTo(x,y):X.moveTo(x,y);}X.strokeStyle=BLUE;X.lineWidth=6;X.lineCap='round';X.stroke();X.restore();});
 const b=P(u,tm-.1,.5,E.back);if(b>0){pill('acima de R$ 80 mil',CX,1330,{size:36,fill:true,scale:b,alpha:cl(b*2),icon:(x,y,sz)=>check(x,y,sz*.8,'#fff',6)});}
},cues(){const s='s1',tf=L(s,'fatura'),t80=L(s,'80');const a=[[.15,'soft_whoosh',.5],[L(s,'farmácia')-.15,'shimmer',.35],[tf-.35,'swipe',.5]];for(let x=tf;x<t80+.4;x+=.08)a.push([x,'tick',.22]);a.push([t80+.4,'ding',.5],[L(s,'mês')-.1,'pop',.6]);return a;}};

S.s2={draw(u){const s='s2';const tt=L(s,'tipo'),t24=L(s,'24'),t7=L(s,'7');
 rings(CX,900,u,true);
 bin('um novo tipo de',CX,700,u,.05,{size:48,color:'rgba(244,244,244,.55)',w:400});
 letters('“prescritor”',CX,820,u,tt-.1,{size:132,w:600,color:'#FFFFFF',glow:30,stag:.04});
 sweep(CX-420,740,840,170,P(u,tt+.7,.8,E.io),true);
 const chip=(label,x,y,a,ico)=>enter(u,a,x,y,()=>{const fl=Math.sin(u*2+x)*8;X.save();X.translate(0,fl);pill(label,x,y,{size:38,dark:true,light:true,icon:ico});X.restore();});
 chip('24h por dia',330,1110,t24-.1,(x,y,sz)=>{X.save();X.translate(x,y);X.strokeStyle=CYAN;X.lineWidth=4;X.beginPath();X.arc(0,0,sz*.42,0,Math.PI*2);X.stroke();X.rotate(u*4);X.beginPath();X.moveTo(0,0);X.lineTo(0,-sz*.3);X.stroke();X.restore();});
 chip('7 dias por semana',700,1240,t7-.1,(x,y,sz)=>{X.fillStyle=CYAN;for(let i=0;i<7;i++){X.globalAlpha=u>t7+i*.06?1:.25;X.beginPath();X.arc(x-sz*.45+(i%4)*sz*.3,y-sz*.15+Math.floor(i/4)*sz*.3,sz*.08,0,Math.PI*2);X.fill();}X.globalAlpha=1;});
 // ponto orbitando
 const an=u*1.2;glowDot(CX+Math.cos(an)*310,900+Math.sin(an)*310,8,u);
},cues(){const s='s2',t7=L(s,'7');const a=[[.05,'soft_whoosh',.5],[L(s,'tipo')-.1,'letters',.5],[L(s,'tipo')+.7,'shimmer',.35],[L(s,'24')-.1,'pop',.55]];for(let i=0;i<7;i++)a.push([t7+i*.06,'tick',.2]);a.push([t7-.1,'pop',.55]);return a;}};

S.s3={draw(u){
 bin('nunca pede',CX,640,u,0,{size:52,color:GRAY,w:400});
 enter(u,.05,CX,860,()=>{card(190,770,700,180,{r:90});F(54,600);X.fillStyle=INK;X.textAlign='left';X.textBaseline='middle';X.fillText('Comissão',260,862);
  const on=1-P(u,.5,.3,E.io);toggle(780,860,on);});
 if(u>.5&&u<.75)ripple(780,860,u,.5);
 const b=P(u,.8,.45,E.back);if(b>0)pill('R$ 0 por paciente',CX,1060,{size:40,scale:b,alpha:cl(b*2)});
},cues(){return[[0,'soft_whoosh',.4],[.05,'swipe',.4],[.5,'toggle',.8],[.8,'pop',.5]];}};

S.s4={draw(u){const s='s4';const b1=L(s,'clientes')-.1,b2=L(s,'receita')-.15,b3=L(s,'mão')-.05;
 const k=P(u,0,.7,E.expo);const py=lerp(1500,1000,k);
 X.save();X.globalAlpha=cl(k*1.5);if(k<1)X.filter=`blur(${((1-k)*14).toFixed(1)}px)`;X.translate(CX,py);X.rotate(lerp(.14,-.04,k));
